name: Deploy Laravel
on:
  push:
    branches: [ main ]
jobs:
  deploy-own-server:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: 'Babbal Host'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Composer Dependencies
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app php:8.4-cli-alpine sh -c "apk add --no-cache git unzip \
            && curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions \
            && chmod +x /usr/local/bin/install-php-extensions \
            && install-php-extensions zip gd exif \
            && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer \
            && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts"

      - name: Fix file ownership after composer
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Verify build assets exist
        run: |
          if [ ! -d "public/build" ] || [ -z "$(ls -A public/build 2>/dev/null)" ]; then
            echo "ERROR: public/build is missing or empty."
            echo "Run 'yarn build' locally and commit the public/build folder before pushing to main."
            exit 1
          fi
          echo "Found committed build assets:"
          ls -la public/build

      - name: Package build for transfer
        run: |
          rm -rf .git .github node_modules
          rm -f .env .env.example
          tar -czf ../deploy.tar.gz --exclude=storage .
          mv ../deploy.tar.gz ./deploy.tar.gz

      - name: Upload archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.tar.gz"
          target: "~/"
          strip_components: 0

      - name: Extract archive and run post-deploy Artisan commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }} && php artisan down || true
            tar -xzf ~/deploy.tar.gz -C ${{ secrets.DEPLOY_PATH }}
            rm -f ~/deploy.tar.gz
            cd ${{ secrets.DEPLOY_PATH }}
            php artisan package:discover --ansi
            php artisan config:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            php artisan queue:restart || true
            php artisan up
